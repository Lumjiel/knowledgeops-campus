# 精简部署版（lite）：app + mysql + web 三服务，向量库切 simple，队列切 db_polling，
# 砍掉 redis / rabbitmq / tempo。目标机器 2 核 4G。
# 约定：密钥全部走 .env（OPENAI_API_KEY / OPENAI_BASE_URL / MYSQL_PASSWORD），.env 不入库。
# 与原 docker-compose.yml 的绑定差异（按 application.yml 实际契约修正）：
#   spec-D 草稿写的 MYSQL_HOST/MYSQL_PASSWORD 应用侧并不消费，应用数据源绑定 DB_URL/DB_USERNAME/DB_PASSWORD。
services:
  app:
    build: .
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      # 向量库：simple 文件快照，省掉 pgvector（坑 1：路径必须指向挂载卷，否则重启丢索引）
      - APP_VECTOR_STORE_BACKEND=simple
      - APP_REQUIRE_PGVECTOR=false
      - APP_SIMPLE_VECTOR_STORE_PATH=/data/vector-store/chat-pdf.json
      # 队列：砍掉 redis/rabbitmq，用 db_polling；worker 关闭，种子导入走同步处理
      - APP_INGESTION_QUEUE_BACKEND=db_polling
      - APP_INGESTION_WORKER_ENABLED=false
      - RAG_RETRIEVE_TOP_K=12
      - RAG_RERANK_TOP_K=6
      # 模型
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL}
      # 数据源（应用实际绑定的变量名，见 application.yml datasource 段）
      - DB_URL=jdbc:mysql://mysql:3306/knowledgeops_agent?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=GMT%2B8
      - DB_USERNAME=root
      - DB_PASSWORD=${MYSQL_PASSWORD}
      # prod profile 必填：CORS 白名单
      - APP_CORS_ALLOWED_ORIGINS=${APP_CORS_ALLOWED_ORIGINS:-http://localhost}
      # 种子语料：容器内路径（demo-data 只读挂载），详见 config/SeedDataRunner.java
      - APP_SEED_ENABLED=true
      - APP_SEED_SOURCEDIR=/data/seed
    volumes:
      - vector-data:/data/vector-store
      - ./demo-data:/data/seed:ro
    ports: ["8080:8080"]
    depends_on:
      mysql:
        condition: service_healthy
    mem_limit: 1536m

  mysql:
    image: mysql:8.0
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DATABASE=knowledgeops_agent
    volumes:
      - mysql-data:/var/lib/mysql
    # 坑 2：MySQL 首次启动要等，app 必须 condition: service_healthy 而不是裸 depends_on
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    # 坑 2 之外的安全底线：不映射端口到宿主机，只留在容器内网
    mem_limit: 768m

  web:
    build: ./frontend
    ports: ["80:80"]
    depends_on:
      app:
        condition: service_healthy
    mem_limit: 128m

volumes:
  vector-data:
  mysql-data:
